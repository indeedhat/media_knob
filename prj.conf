# Increased stack due to settings API usage
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096


# Bluetooth
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SMP_ENFORCE_MITM=n

CONFIG_BT_PERIPHERAL=y

CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP_PID=0x615E
CONFIG_BT_DIS_PNP_VID=0x1D50
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MANUF_NAME_STR="Knoblet"

CONFIG_BT_BAS=y
CONFIG_BT_DEVICE_NAME="Knoblet"
CONFIG_BT_DEVICE_APPEARANCE=962

CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_PRIVACY=n

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_BT_GATT_CACHING=y
CONFIG_BT_GATT_SERVICE_CHANGED=y

CONFIG_KNOBLET_BT_CLEAR_BONDS_ON_START=n


# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=3


# Settings
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y


# Gpio
CONFIG_GPIO=y
CONFIG_INPUT=y


# fix bootloader offset
CONFIG_FLASH_LOAD_OFFSET=0x1000
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=y
CONFIG_USE_DT_CODE_PARTITION=n


# AS5600 sensor
CONFIG_SENSOR=y
CONFIG_AMS_AS5600=y
CONFIG_I2C=y


# Battery
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y


# Power Management
CONFIG_BT_CTLR_TX_PWR_MINUS_20=y
CONFIG_PM=y
CONFIG_PM_DEVICE=y


# Debug
CONFIG_FAULT_DUMP=2


# Macro mode
CONFIG_KNOBLET_ENABLE_MACRO_MODE=y
